# A measured main commit is deliberately promoted to publish. autorelease.mjs
# moves each changed package (and what pins it exactly) to its next patch
# version, the release is built and every version npm lacks is published, and
# the version commit goes back to publish. Main is built and measured from source.
# The first push creating publish is also a promotion; one push releases.
# Auth is the repository secret NPM_TOKEN
# (an npm automation token with write on the @volter scope).
# npm may accept a publish ("+ pkg@ver") and hold it as STAGED until an owner
# approves it with 2FA (`npm stage list|approve`); a staged version isn't on
# the registry. The last step reads every published version back and fails
# the run, naming each one npm doesn't serve. The log keeps npm publish's own
# output, and the served checks wait (backoff, up to 20 min before a dependent publishes, 75 min at the end) before saying a
# version npm accepted is not served yet, so a slow registry never reads as a
# lost release.
name: publish
on:
  push:
    branches: [publish]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/publish'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      LOCKSTEP: '0.5'
      PIN_FILES: packages/game-editor/catalog/entries/blender.json packages/game-editor/catalog/entries/music.json
      VERSION_TEXT: packages/dawproject/src/render.ts=@volter/dawproject
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Both products and the playable tools, from release/game.json
        run: |
          echo "PACKAGES=$(for name in $(node -p "require('./release/game.json').packages.join(' ')"); do grep -l "\"name\": \"$name\"" packages/*/package.json | xargs dirname; done | tr '\n' ' ')" >> "$GITHUB_ENV"
      - run: git config core.fileMode false
      - name: Version what changed since its last release
        id: release
        run: node .github/autorelease.mjs
      - if: steps.release.outputs.released
        name: The lockfile follows the versions
        run: if [ -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
      - name: The files the release changed
        run: git diff --name-only > "$RUNNER_TEMP/release-files"
      - name: Which versions npm lacks
        id: check
        run: |
          new=""
          for dir in $PACKAGES; do
            spec="$(node -p "const p=require('./$dir/package.json'); p.name+'@'+p.version")"
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then echo "$spec is published"; else echo "$spec is new"; new="$new $dir"; fi
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.new
        run: npm ci
      - if: steps.check.outputs.new
        run: npm run build:game
      - if: steps.check.outputs.new
        run: npm run check:release:game && npm run check:release:playable && npm run check:packed-imports:game
      - if: steps.check.outputs.new
        name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Dependencies first, each dependent only once npm serves its dependencies' exact versions
        # and tarballs (.github/publish-in-order.mjs), so `latest` never names an uninstallable tree.
        run: node .github/publish-in-order.mjs ${{ steps.check.outputs.new }}
      - name: The version commit goes back to publish
        run: |
          [ -s "$RUNNER_TEMP/release-files" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(cat "$RUNNER_TEMP/release-files")
          git commit -qm "Release $(for dir in $PACKAGES; do git diff --cached --quiet -- "$dir/package.json" || node -p "const p=require('./$dir/package.json'); p.name+'@'+p.version"; done | tr '\n' ' ')"
          git reset -q --hard HEAD
          # Do not graft the version commit onto another promotion's source.
          # Finish this run before promoting the next measured commit.
          git push origin HEAD:publish
      - if: steps.check.outputs.new
        name: npm serves every version this run published
        # The exact version AND its tarball, retried with a bound: npm has listed a version whose
        # tarball still answered 404 (@volter/blender-engine@0.1.122, 2026-10-06).
        run: node .github/publish-in-order.mjs --served ${{ steps.check.outputs.new }}
