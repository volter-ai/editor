      "note": "Platformer 3D — the official Godot 3.x 3D platformer demo, and the Godot lane's SECOND 3D fixture. Where squash-the-creeps is a tutorial game (4 scripts / 4 scenes / one mob), this is a full demo level: 6 scene documents, 159 placed nodes, 21 distinct declared node classes, 49 instanced sub-scenes, a GridMap over an 18-tile MeshLibrary, an AnimationTree blend graph over 8 skeletal clips, CPUParticles, ReflectionProbes, reverb Areas over a custom AudioBusLayout, and a PanoramaSky Environment. This is an ANALYSIS FIXTURE, not a runnable ingest — nothing serves it, the import ladder measures it — which is why it lives here rather than in vendor/games/.\n\n WHY THIS PATH AND THIS PIN. `3d/platformer` in `godotengine/godot-demo-projects` on the `3.x` branch, at fe1ccaea7725053f760d7a30b8a44619686224e8 — MEASURED as the `3.x` branch head at the retrieval date, and the SAME commit dodge-the-creeps is already pinned to, so the two demo-repo fixtures share one pin. Its `project.godot` reads `config_version=4` and declares no `config/features`, the identical Godot 3 dialect rota, dodge and squash are read in, so the one pinned Godot 3.6.2 api.json serves all four.\n\n THE FIXTURE ID. `platformer-3d`, the project's own `config/name=\"Platformer 3D\"` kebab-cased — the same rule that gave squash-the-creeps its id over its upstream directory name. The upstream directory is called `platformer` and sits under `3d/`; using that bare name here would read as a 2D fixture, and `godot-3d-platformer` would be the first fixture id in this shelf named after the ENGINE rather than the game.\n\n LICENSE VERIFICATION, every file read at the pinned commit: `3d/platformer/` carries NO license file of its own (unlike `2d/dodge_the_creeps/`, which does). The repository root carries LICENSE.md, verbatim MIT (Copyright (c) 2007-2022 Juan Linietsky, Ariel Manzur; Copyright (c) 2014-2022 Godot Engine contributors), no additional terms — vendored to the fixture root, which is why `license_file` resolves. The repo-root README.md states \"Those demos are distributed under the terms of the MIT license, as described in the LICENSE.md file\" and carries no third-party attribution; the demo's own README.md carries none either. Read in full and checked against the vendored tree: there is no third-party asset in this demo with terms of its own — no external font, no CC-BY audio, no CC0 art pack. Every .wav, .png, .tres and .tscn under `3d/platformer/` is Godot-project content under the root MIT. That is why, unlike squash-the-creeps, the repo-root README.md is NOT vendored: there it carried the third-party terms the attribution depends on, and here it carries nothing the license story needs.",
      "excluded_from_upstream": {
        "rule": "NOTHING under `3d/platformer/` is excluded — all 55 tracked files are vendored, byte-for-byte, at the fixture root, plus the repository-root LICENSE.md the license verification above depends on. What the `paths` list records is the repository's OWN top-level chrome, which lies outside the Godot project and outside its licence story. The other ~100 demo directories in this repository are different games and are not \"excluded\" from this one in any meaningful sense.",
        "why": "MEASURED FIRST, as every lock on this shelf is. Upstream tracks 55 files totalling 5,190,501 bytes under `3d/platformer/` and ALL 55 are vendored, byte-for-byte — the two sets identical rather than merely equal in size — plus the repository-root LICENSE.md (1,131 bytes), giving 56 files / 5,191,632 bytes. This follows dodge-the-creeps, the other fixture taken from this repository at this pin, which excludes nothing from its demo directory either; rota's extension whitelist exists because rota's upstream tree is 67.5 MB, and that reason does not arise at 5.19 MB. Three file classes were decided rather than defaulted. (1) `screenshots/` (face.png, shoot.png, .gdignore — 916 KB) is KEPT: it sits INSIDE the Godot project (which is why upstream put a .gdignore beside it) and is what the demo's own README.md renders, exactly as dodge-the-creeps keeps `screenshots/dodge.png`. squash-the-creeps excludes its banner image because that banner lives at its REPOSITORY root, outside the Godot project — a different fact, not a contrary precedent. (2) `export_presets.cfg` is KEPT for the same reason the `.import` sidecars are: it is part of what upstream tracks under the project directory, the S0 reader never opens it, and excluding it would make the vendored set a judgement call instead of a fact (\"the whole project tree\" needs no rule). (3) `robot_walk.wav` is 1.6 MB, 31% of the fixture, and is kept for the same reason dodge-the-creeps keeps its 1.85 MB of audio: a partial vendoring would buy nothing while leaving the S4 rung without the assets it will play. Note that vendoring the media changes no diagnostic: `ext-resource-opaque` is a statement about the FORMAT this reader opens, reported identically whether or not the bytes are present. The demo directory carries no `.gitignore` of its own, so unlike the other three fixtures there is no nested ignore file to check.",
