      "note": "Dodge the Creeps — the finished game from Godot's own 'Your first 2D game' tutorial, and the Godot lane's PILOT: an EXTERNAL canonical game small enough to run the whole pipe on (4 scripts / 4 scenes / 25 nodes) while still exercising the canonical 2D surface — Area2D signals, Timers, input actions, PackedScene instancing, AnimatedSprite, CanvasLayer HUD, PathFollow2D spawning, audio, RigidBody2D, yield-on-signal. External by owner decision: a pilot we author can quietly contain only what our translator already handles. Same Godot 3 dialect as ROTA (config_version=4), so the one pinned api.json serves both. This is an ANALYSIS FIXTURE, not a runnable ingest — nothing serves it, the import ladder measures it — which is why it lives here rather than in vendor/games/. LICENSE VERIFICATION, both files read at the pinned commit: the repository root carries LICENSE.md, verbatim MIT (Copyright (c) 2007-2022 Juan Linietsky, Ariel Manzur; Copyright (c) 2014-2022 Godot Engine contributors), and the demo directory carries its own LICENSE, verbatim MIT (Copyright (c) 2017 KidsCanCode). No additional terms in either. The demo's README.md states the third-party asset terms and is vendored with the tree, which is what carries the attribution those terms require: art/'House In a Forest Loop.ogg' is CC-BY 3.0 (HorrorPen, opengameart.org), the images are CC0 1.0 (kenney.nl, 'Abstract Platformer'), and fonts/Xolonium-Regular.ttf is SIL OFL 1.1 (Severin Meyer) with its own fonts/LICENSE.txt and fonts/FONTLOG.txt vendored beside it.",
      "excluded_from_upstream": {
        "rule": "NOTHING is excluded. Every file upstream tracks under 2d/dodge_the_creeps at the pinned commit is vendored, byte-for-byte: 43 of 43, and the two sets are identical rather than merely equal in size.",
        "why": "MEASURED FIRST, as the rota lock's whitelist was: the whole game is 2,158,715 bytes, of which 1,854,193 (86%) is two audio files. ROTA needed an extension whitelist because its upstream tree is 67.5 MB; that reason does not exist at 2.06 MB, and a partial vendoring would buy nothing while leaving the S4 rung (a committed port that BOOTS and behaves) without the art it will render. Two file classes were decided rather than defaulted. (1) Godot's `.import` sidecars are editor artifacts the S0 reader never opens — kept anyway, because they are part of what upstream tracks and excluding them would make the vendored set a judgement call instead of a fact ('everything' needs no rule). (2) The demo's own `.gitignore` (`.import`, `logs/`) is a nested ignore file that takes effect inside THIS repo — checked, and it matches no vendored path (the sidecars are named `<file>.png.import`, not `.import`), so it is carried unaltered like everything else. Note that vendoring the art changes no diagnostic: `ext-resource-opaque` is a statement about the FORMAT this reader opens, reported identically whether or not the bytes are present.",
