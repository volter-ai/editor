      "note": "Starter Kit 3D Platformer (Kenney) — the Godot lane's SECOND Godot 4 project, and the first\n from an upstream that is not `godotengine/godot-demo-projects`. Where `platformer-3d-godot4`\n holds the GAME constant to isolate the engine major, this one holds the ENGINE MAJOR constant\n and changes the author: same 4.x dialect, a different studio's idea of how a 3D platformer is\n built. Everything it demands that the demo-projects fixture does not is therefore attributable\n to AUTHORING STYLE rather than to Godot — which is the only way to tell a lane gap apart from a\n one-project quirk. It is an ANALYSIS FIXTURE, not a runnable ingest — nothing serves it, the\n import ladder measures it — which is why it lives here rather than in vendor/games/.\n \n WHY THIS PIN. `main` at 3fa8a04b1c01ab23db43123d4ce814a34c3fc7f0, MEASURED as the default\n branch's head at the retrieval date (`main`, 1,201 stars, not archived, last pushed\n 2026-03-12 — the pin IS that push, titled \"Upgrade to Godot 4.6\"). The repository ships one\n project at its ROOT rather than one demo directory among a hundred, so `upstream_path` is `.`\n and the fixture root IS the repository root. `project.godot` reads `config_version=5` and\n `config/features=PackedStringArray(\"4.6\", \"Forward Plus\")` — Godot 4.6, one minor behind the\n pinned `godot-4.7-extension_api.json` this lane adjudicates 4.x surface against, and the newest\n engine version on the shelf. HEAD was checked before pinning and needed no fallback: the four\n commits before it are the 4.4/4.5/4.6 upgrade sequence plus a `set_deferred` fix, all\n first-party, none of them a restructure that would make an older commit the honest read.\n \n THE FIXTURE ID. `starter-kit-3d-platformer`, which is this project's own `config/name`\n (\"Starter Kit 3D Platformer\") kebab-cased — the shelf's ordinary rule, applied with no\n exception. It does NOT collide with `platformer-3d`/`platformer-3d-godot4` (whose shared\n `config/name` is \"Platformer 3D\"), so unlike those two it needs no engine suffix to\n disambiguate, and adding one would name a variable this fixture does not hold.\n \n DOCUMENT FORMAT, measured file by file. Every scene and resource is TEXT — 10 `.tscn` and 2\n `.tres`, no binary scene anywhere. Nine of the twelve carry `format=3`, the same header the\n other Godot 4 fixture is read in; `objects/coin.tscn` carries `format=4`, and it is the FIRST\n `format=4` document on this shelf. The reader opens it with no diagnostic and no special case\n (`read/scene.ts` records `format` on the document and gates nothing on it), and the read is\n real rather than lenient: that one file resolves 3 ext-resources and 12 sub-resources including\n a full `ArrayMesh` with `_surfaces` PackedByteArray geometry. TWO binary `.res` files\n (`meshes/brick.res`, `meshes/dust.res`) are Godot's own `RSRC` container holding `ArrayMesh`\n resources, opened by this package's binary reader, and they are the reason those bytes are\n load-bearing rather than incidental — see `excluded_from_upstream` below.\n \n LICENSE VERIFICATION, every file carrying terms read at the pinned commit. The repository root\n carries LICENSE.md, verbatim MIT (Copyright (c) 2023 Kenney), no additional terms — vendored,\n which is why `license_file` resolves. README.md restates that MIT text (its copyright line\n reads 2026 where LICENSE.md reads 2023; the terms are identical) and then adds the one thing\n the license file does not say: \"Assets included in this package (2D sprites, 3D models and\n sound effects) are CC0 licensed\". That covers the 15 `.glb`, the 8 `.png`, the 6 `.ogg` and\n the `.fla`, all first-party Kenney work — the asset risk this candidate was chosen to AVOID,\n and README.md is vendored because it is where that grant lives. ONE third-party file exists\n and carries its own terms beside it: `fonts/lilita_one_regular.ttf` is Lilita One (Copyright\n (c) 2011 Juan Montoreano), under the SIL Open Font License 1.1, whose full text is\n `fonts/license.txt` — vendored with it, since OFL-1.1 §2 conditions redistribution on the\n copy carrying that notice. OFL-1.1 permits bundled redistribution and forbids only selling the\n font by itself, which this shelf does not do. No other file in the tree carries terms of its\n own.",
      "excluded_from_upstream": {
        "rule": "NOTHING is excluded. All 100 files upstream tracks at the pinned commit are vendored, byte-for-byte, at the fixture root.",
        "why": "MEASURED FIRST, as every lock on this shelf is. Upstream tracks 100 files totalling 5,208,758\n bytes at the pinned commit and ALL 100 are vendored, byte-for-byte — verified by comparing each\n vendored file against `git cat-file blob` at that commit, 0 mismatches — so the vendored tree\n IS the upstream tree and the two counts below are the same number. This follows\n platformer-3d-godot4, which excludes nothing either; rota's extension whitelist exists because\n rota's upstream tree is 67.5 MB, and that reason does not arise at 5.21 MB.\n \n FOUR file classes were decided rather than defaulted, and three of them are the classes\n platformer-3d-godot4's lock had to decide too.\n (1) `screenshots/` (screenshot.png, .gdignore — 322 KB) is KEPT: it sits INSIDE the Godot\n project, which is why upstream put a .gdignore beside it, and it is what the project's own\n README.md renders.\n (2) The 9 `.uid` sidecars are KEPT: a Godot 4 addition with no Godot 3 counterpart, tracked\n upstream, and a fixture measuring what a Godot 4 project LOOKS like must not drop the files\n that only exist in Godot 4.\n (3) The BINARY resources — `meshes/brick.res` (7,119 bytes) and `meshes/dust.res` (39,063) —\n are KEPT and are evidence rather than bulk: they are Godot's own `RSRC` container, they hold\n the ArrayMesh geometry `objects/brick.tscn` instances, and they are what this package's binary\n reader is pointed at. Dropping them would delete the measurement.\n (4) `vector/sprites.fla` (50,762 bytes, an Adobe Animate source with a `.gdignore` beside it)\n is KEPT despite being ART SOURCE the engine never loads. It is 1% of the tree, it is covered by\n the README's CC0 grant, and excluding it would buy nothing while making the \"the vendored tree\n IS the upstream tree\" claim above conditional. `sprites/skybox.png` is 3.9 MB — 75% of the\n fixture — and is kept for the same reason platformer-3d keeps its 1.6 MB `.wav`: partial\n vendoring saves little and leaves the upper rungs without the assets they will render.\n \n The repository ships NO chrome outside the Godot project — no `.github/`, no CONTRIBUTING.md,\n no build scripts — so unlike platformer-3d-godot4 there is no top-level layer to list here.\n The two files that are arguably git-only rather than Godot-only, `.gitignore` and\n `.gitattributes`, are vendored with the rest: the `.gitignore` names only build/import\n artefacts (`.godot/`, `.import/`, `export*.cfg`, `*.translation`, `.mono/`, `build/`), none of\n which any of the 100 vendored paths matches, so it hides nothing from `verify-unaltered.mjs`\n or from git.",
