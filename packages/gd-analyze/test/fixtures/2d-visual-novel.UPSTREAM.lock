      "note": "2D Visual Novel (godot/ in godot-4-2d-visual-novel), a Godot 4 analysis fixture. WHY THIS PIN: `main` head of gdquest-demos/godot-4-2d-visual-novel at retrieval (94dafe94, 2026-05-16). The repository holds TWO Godot projects that share config/name \"2D Visual Novel\": `godot/` (the finished demo, features \"4.6\") and `start-project/` (the tutorial's asset-only starting point, features \"4.3\"); each is staged as its own fixture, and the sibling is out of scope here, not an exclusion. The finished demo: a scripted-dialogue visual novel with its own lexer/parser/transpiler for .txt scene scripts. ID: config/name \"2D Visual Novel\" kebab-cased; no collision with the existing shelf. LICENSE (repository root, vendored at the fixture root): dual terms, MIT for source code, scenes, shaders and Godot-generated resources (Copyright (c) 2020-present GDQuest) and CC-BY-NC-SA-4.0 for art assets (textures, 3D models), full CC text included. The owner ruled 2026-09-28 that CC licenses including NC and SA are acceptable for benchmarking, which lifts the earlier rejection; the NC/SA terms still bind any redistribution of the art. README.md (repository root, vendored) carries the art attribution (\"Art by Asmo Arael\") the CC-BY terms require. The Montserrat-ExtraBold.ttf font ships without its own OFL text upstream. SECURITY (static read, nothing executed): ONE finding, RUNTIME CODE EVALUATION: Autoloads/Variables.gd _evaluate(input) builds GDScript.new(), set_source_code(\"func eval():\\n\\treturn \" + input), reload() and calls it; it is reached from ScenePlayer.gd via Variables.add_variable() for the `set` command of the bundled res://Parser/test-scene*.txt dialogue scripts, so the evaluated text is project-authored (e.g. `set started_over true`), not network or user input. It is arbitrary-code-capable if fed untrusted scene scripts; harmless for static analysis, which never runs it. Variables.gd reads/writes user://2DVisualNovelDemo.save; ScenePlayer._store_scene_data() writes var_to_str() to a caller-supplied path but has no caller. No @tool, no EditorPlugin (editor_plugins enabled list is empty), no OS.execute/shell_open, no network API, no .gdextension, no native blob, no C# ([dotnet] assembly_name only). Autoloads: ResourceDB, Variables. Cloned 2026-09-28 with `git -c core.hooksPath=/dev/null clone --depth 1`, no submodules; bytes vendored from `git cat-file blob` at the pin and re-read from disk, 0 mismatches. File modes are not carried (all staged 0644).",
