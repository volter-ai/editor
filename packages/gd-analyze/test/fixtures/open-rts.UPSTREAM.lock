      "note": "Open RTS (lampe-games/godot-open-rts), a Godot 4 analysis fixture: a mid-size RTS (118 .gd, 84 .tscn) and the largest Godot 4 project on the shelf. WHY THIS PIN: `main` head at retrieval (a628ad3b); the repository root is the project root; project.godot reads config_version=5, features \"4.3\" (README: compatible with Godot 4.3). ID: config/name \"Open RTS\" kebab-cased; no collision. LICENSE: LICENSE is verbatim MIT (Copyright (c) 2023 Lampe Games); README credits Kenney's 3D Space Kit (CC0); LOGO_LICENSES.md (root and assets/logos/, both vendored) gives the Godot logo PNG as CC-BY-4.0 (Andrea Calabró) and the Lampe Games logo as all rights reserved, which is excluded. media/ (README banner, screenshots, logo.kra Krita source, .gdignore) sits inside the project and is kept. DANGLING REFERENCES LEFT BY THE REQUIRED EXCLUSIONS: source/Logos.tscn keeps its ext_resource to res://assets/logos/lampe_games_white.svg, and source/match/MatchConstants.gd keeps 14 preload()/path references to res://assets/voice/...; in a real editor that script would fail to load, so this fixture is analysis-only and the analyzer will see those as missing resources. SECURITY (static read, nothing executed): 8 @tool scripts (source/match/Map.gd, units/traits/{Highlight,Selection,HealthBar,Targetability}.gd, generic-scenes-and-nodes/3d/{FadedCircle3D,Circle3D}.gd, 2d/DynamicCircle2D.gd); read: they draw selection/health circles and polygons for in-editor preview and guard on Engine.is_editor_hint(), no I/O; benign. No EditorPlugin, no OS.execute/shell_open (OS.* use is limited to processor/memory/name readouts in debug/DiagnosticHud.gd), no network API, no GDScript.new/set_source_code, no .gdextension, no native blob, no C#. 6 autoloads (FeatureFlags, Constants, Globals, MatchSignals, Signals, Utils). export_presets.cfg is kept (Godot project config, no secrets). Cloned 2026-09-28 with `git -c core.hooksPath=/dev/null clone --depth 1`, no submodules; bytes vendored from `git cat-file blob` at the pin and re-read from disk, 0 mismatches. File modes are not carried (all staged 0644).",
