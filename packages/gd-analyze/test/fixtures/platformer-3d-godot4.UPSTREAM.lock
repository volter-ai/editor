      "note": "Platformer 3D (Godot 4) — the GODOT 4 COUNTERPART of the `platformer-3d` fixture, and the Godot lane's first Godot 4 project. Same game, different engine major: upstream maintains one 3D-platformer demo per engine line, so holding the GAME constant makes every difference the lane measures attributable to the ENGINE. That control is the whole reason this fixture exists; a different Godot 4 demo would have measured the game and the engine at once. It is an ANALYSIS FIXTURE, not a runnable ingest — nothing serves it, the import ladder measures it — which is why it lives here rather than in vendor/games/.\n\n WHY THIS PATH AND THIS PIN. `3d/platformer` in `godotengine/godot-demo-projects` on the `master` branch, at 4652e17c04fe5f249dc53949fb195a3d8b24ee5f — MEASURED as the `master` branch head at the retrieval date. `master` is the exact structural analog of the `3.x` branch the Godot 3 fixtures are pinned to: the repository's own README states \"The `master` branch is compatible with Godot's `master` development branch (next 4.x release)\" and \"The `3.x` branch is compatible with Godot's `3.x` development branch (next 3.x release)\". Per-release branches exist only up to `4.3`; `master` is where the living 4.x demo set is, and a pinned commit makes the fixture stable regardless. Its `project.godot` reads `config_version=5` and `config/features=PackedStringArray(\"4.7\")`, and every `.tscn`/`.tres` header says `format=3` — the Godot 4 dialect, against the `config_version=4` / `format=2` dialect the other four fixtures are read in. There is deliberately NO Godot 4 `extension_api.json` beside `vendor/extension-api/godot-3.6.2-api.json`: this fixture is vendored at ladder stage `blocked`, and the dump it would be adjudicated against is one of the things the measurement says is missing (`vendor/extension-api/UPSTREAM.md` predicted exactly this requisition).\n\n THE FIXTURE ID. `platformer-3d-godot4`. The shelf's rule is the project's own `config/name` kebab-cased, and here that rule COLLIDES: this project's `config/name` is \"Platformer 3D\", the same string the Godot 3 fixture kebab-cases to `platformer-3d`, because it is the same game. The suffix names the only thing that distinguishes the two — the engine major — which is also the single variable this fixture exists to measure. That is the one case where naming a fixture after the engine is the honest choice rather than the lazy one, and it is why `platformer-3d` (the Godot 3 fixture) keeps its unsuffixed id: it is the control, not the variable.\n\n LICENSE VERIFICATION, every file read at the pinned commit: `3d/platformer/` carries NO license file of its own. The repository root carries LICENSE.md, verbatim MIT (Copyright (c) 2014-present Godot Engine contributors; Copyright (c) 2007-2014 Juan Linietsky, Ariel Manzur), no additional terms — vendored to the fixture root, which is why `license_file` resolves. The repo-root README.md's \"License\" section states \"Those demos are distributed under the terms of the MIT license, as described in the LICENSE.md file\" and carries no third-party attribution. THE DEMO'S OWN README.md DOES: \"This project uses Virtual joystick add-on by Marco F\", the source of `touch_screen_ui/virtual_joystick/` (11 files: one .gd, one .tscn, two .png and their .import sidecars). That upstream — github.com/MarcoFazioRandom/Virtual-Joystick-Godot — publishes a verbatim MIT LICENSE (Copyright (c) 2019 Marco F), read at retrieval, so the vendored bytes are MIT twice over and the attribution the terms depend on is the demo README, which is why README.md is vendored here (as it is for platformer-3d, and unlike the repo-root README, which is not). No other third-party asset in this demo carries terms of its own: every .wav, .webp, .png, .glb, .res, .scn, .tres and .tscn is Godot-project content under the root MIT.",
      "excluded_from_upstream": {
        "rule": "NOTHING under `3d/platformer/` is excluded — all 145 tracked files are vendored, byte-for-byte, at the fixture root, plus the repository-root LICENSE.md the license verification above depends on.",
        "why": "MEASURED FIRST, as every lock on this shelf is. Upstream tracks 145 files totalling 3,643,029 bytes under `3d/platformer/` and ALL 145 are vendored, byte-for-byte — verified by hashing each vendored file against `git cat-file blob` at the pinned commit, 0 mismatches — plus the repository-root LICENSE.md (1,134 bytes), giving 146 files / 3,644,163 bytes. This follows platformer-3d and dodge-the-creeps, the other fixtures taken from this repository, which exclude nothing from their demo directories either; rota's extension whitelist exists because rota's upstream tree is 67.5 MB, and that reason does not arise at 3.64 MB. Four file classes were decided rather than defaulted. (1) `screenshots/` (platformer.webp, .gdignore — 249 KB) is KEPT: it sits INSIDE the Godot project (which is why upstream put a .gdignore beside it) and is what the demo's own README.md renders — the same call platformer-3d and dodge-the-creeps make. (2) The `.uid` sidecars (9 files) are KEPT: they are a Godot 4 addition with no Godot 3 counterpart, upstream tracks them under the project directory, and a fixture that measures what a Godot 4 project LOOKS like must not quietly drop the files that only exist in Godot 4. (3) The BINARY resources — 25 `.res` and one `.scn`, 6.8 KB to 4 KB each — are KEPT and are load-bearing evidence rather than incidental bytes: they are where this demo's 18 tile meshes and its GridMap live, they are Godot's own `RSRC`/`RSCC` container format, and their presence is the single largest measured gap between the two engine majors (the Godot 3 twin authors the same meshes as inline text `ArrayMesh` sub-resources this lane already decodes). (4) `robot_walk.wav` is 1.6 MB, 44% of the fixture, and is kept for the same reason platformer-3d keeps its copy: partial vendoring would buy nothing while leaving the upper rungs without the assets they will play. Note that vendoring the media changes no diagnostic: `ext-resource-opaque` is a statement about the FORMAT this reader opens, reported identically whether or not the bytes are present. The demo directory carries no `.gitignore` of its own, so as with platformer-3d there is no nested ignore file to check. What the `paths` list records is the repository's OWN top-level chrome, which lies outside the Godot project and outside its licence story; the other ~100 demo directories in this repository are different games and are not \"excluded\" from this one in any meaningful sense.",
