      "note": "Starter Kit FPS (Kenney) — the Godot lane's THIRD Godot 4 project and the SIBLING of\n `starter-kit-3d-platformer`: same upstream author, same starter-kit format, same engine line,\n a different GENRE. Where `platformer-3d-godot4` holds the game constant to isolate the engine\n major and `starter-kit-3d-platformer` holds the engine major constant to isolate the author,\n this one holds BOTH the author and the engine constant and changes only the genre. That makes\n it the lane's cheapest available answer to the question the campaign bar left open — \"is the\n SECOND starter cheap now, or was the first one's cost the project's rather than the lane's\" —\n because everything it demands that its sibling does not is attributable to first-person\n shooter mechanics rather than to Godot or to Kenney's house style. It is an ANALYSIS FIXTURE,\n not a runnable ingest — nothing serves it, the import ladder measures it — which is why it\n lives here rather than in vendor/games/.\n\n WHY THIS PIN. `main` at 185fd2326d74a5cf858cffc616f87cf9696f9cc0, MEASURED as the default\n branch's head at the retrieval date (`main`, 975 stars, not archived, last pushed\n 2026-03-12 — the pin IS that push, titled \"Upgrade to Godot 4.6\", exactly as its sibling's pin\n is that repository's own \"Upgrade to Godot 4.6\"). The repository ships one project at its ROOT\n rather than one demo directory among many, so `upstream_path` is `.` and the fixture root IS\n the repository root. `project.godot` reads `config_version=5` and\n `config/features=PackedStringArray(\"4.6\", \"Forward Plus\")` — Godot 4.6, one minor behind the\n pinned `godot-4.7-extension_api.json` this lane adjudicates 4.x surface against, the same\n offset its sibling carries. HEAD was checked before pinning and needed no fallback: the five\n commits before it are the 4.5/4.6 upgrade sequence plus two community gameplay fixes\n (ceiling jump-cancel, weapon knockback members), none of them a restructure that would make an\n older commit the honest read.\n\n THE FIXTURE ID. `starter-kit-fps`, this project's own `config/name` (\"Starter Kit FPS\")\n kebab-cased — the shelf's ordinary rule, applied with no exception, and the same rule that\n produced `starter-kit-3d-platformer`. It collides with nothing on the shelf, so unlike\n `platformer-3d-godot4` it needs no engine suffix, and adding one would name a variable this\n fixture does not hold.\n\n DOCUMENT FORMAT, measured file by file. Every scene and resource is TEXT — 10 `.tscn` and 4\n `.tres`, no binary scene and no binary `.res` anywhere, which is the one structural\n difference from its sibling (that fixture ships two `RSRC` container `.res` files holding\n ArrayMesh geometry; this one ships none, and its meshes are all `.glb`). All 14 documents\n carry `format=3`, so unlike its sibling there is no `format=4` document here. Two of the four\n `.tres` are SCRIPTED RESOURCES — `weapons/blaster.tres` and `weapons/blaster-repeater.tres`\n declare `type=\"Resource\" script_class=\"Weapon\"`, backed by `scripts/weapon.gd` — the first\n custom-`Resource`-class documents on this shelf, and the mechanism the project's own README\n instructs users to duplicate when adding a weapon.\n\n LICENSE VERIFICATION, every file carrying terms read at the pinned commit. The repository root\n carries LICENSE.md, verbatim MIT (Copyright (c) 2025 Kenney), no additional terms — vendored,\n which is why `license_file` resolves, and confirmed independently by GitHub's own license\n detection for this repository (`mit`). README.md restates that MIT text (its copyright line\n reads 2026 where LICENSE.md reads 2025; the terms are identical) and then adds the one thing\n the license file does not say: \"Assets included in this package (2D sprites, 3D models and\n sound effects) are CC0 licensed\". That covers the 10 `.glb`, the 10 `.png`, the 11 `.ogg`\n and the `.fla`, all first-party Kenney work — the same asset grant, in the same place, as its\n sibling — and README.md is vendored because it is where that grant lives. ONE third-party file\n exists and carries its own terms beside it: `fonts/lilita_one_regular.ttf` is Lilita One\n (Copyright (c) 2011 Juan Montoreano), under the SIL Open Font License 1.1, whose full text is\n `fonts/license.txt` — vendored with it, since OFL-1.1 §2 conditions redistribution on the copy\n carrying that notice. OFL-1.1 permits bundled redistribution and forbids only selling the font\n by itself, which this shelf does not do. That is the identical font and identical arrangement\n its sibling ships. No other file in the tree carries terms of its own.",
      "excluded_from_upstream": {
        "rule": "NOTHING is excluded. All 102 files upstream tracks at the pinned commit are vendored, byte-for-byte, at the fixture root.",
        "why": "MEASURED FIRST, as every lock on this shelf is. Upstream tracks 102 files totalling 4,935,522\n bytes at the pinned commit and ALL 102 are vendored, byte-for-byte — verified by comparing each\n vendored file against `git cat-file blob` at that commit, 0 mismatches, 0 missing, 0 extra —\n so the vendored tree IS the upstream tree and the two counts below are the same number. This\n follows starter-kit-3d-platformer and platformer-3d-godot4, which exclude nothing either;\n rota's extension whitelist exists because rota's upstream tree is 67.5 MB, and that reason does\n not arise at 4.94 MB.\n\n FOUR file classes were decided rather than defaulted, three of them the same classes this\n fixture's sibling had to decide.\n (1) `screenshots/` (screenshot.png, .gdignore — 288 KB) is KEPT: it sits INSIDE the Godot\n project, which is why upstream put a .gdignore beside it, and it is what the project's own\n README.md renders.\n (2) The 7 `.uid` sidecars are KEPT: a Godot 4 addition with no Godot 3 counterpart, tracked\n upstream, and a fixture measuring what a Godot 4 project LOOKS like must not drop the files\n that only exist in Godot 4. Note the count is 7 against 7 `.gd` scripts — every script has\n one, and no scene or resource does, which is the Godot 4.6 shape.\n (3) `vector/sprites.fla` (56,297 bytes, an Adobe Animate source with a `.gdignore` beside it)\n and `sounds/walking.ogg.sfk` (a Sound Forge peak-cache sidecar the engine never loads) are\n KEPT despite both being ART-TOOL residue rather than project content. Together they are ~1.2%\n of the tree, both are covered by the README's CC0 grant, and excluding them would buy nothing\n while making the \"the vendored tree IS the upstream tree\" claim above conditional — the same\n call the sibling lock makes for its own `.fla`. `sprites/skybox.png` is 3.88 MB — 79% of the\n fixture — and is kept for the same reason: partial vendoring saves little and leaves the upper\n rungs without the assets they will render.\n (4) `models/platform-falling.glb.import` is KEPT even though the `.glb` IT DESCRIBES IS NOT\n IN THE REPOSITORY. This is an UPSTREAM fact, not a vendoring choice, and it is recorded here\n because it looks exactly like a vendoring mistake: upstream tracks 10 `.glb` files and 10\n `.glb.import` sidecars, but the sets are not the same 10 — `platform-falling.glb.import`\n has no mesh beside it, and `.gitignore` (which names only `.godot/`, `.import/`,\n `export*.cfg`, `*.translation`, `.mono/`, `build/`, `*~*.TMP`) does not match `*.glb`, so\n nothing hid it — the file is simply absent from the upstream tree. No `.tscn` references it.\n Dropping the orphan sidecar would make the fixture disagree with upstream over a byte the\n reader may well have an opinion about, so it stays and the anomaly is documented instead.\n\n The repository ships NO chrome outside the Godot project — no `.github/`, no CONTRIBUTING.md,\n no build scripts — so as with starter-kit-3d-platformer there is no top-level layer to list\n here. The two files that are arguably git-only rather than Godot-only, `.gitignore` and\n `.gitattributes`, are vendored with the rest: the `.gitignore` names only build/import\n artefacts, none of which any of the 102 vendored paths matches, so it hides nothing from\n `verify-unaltered.mjs` or from git.",
