      "note": "Starter Kit City Builder (Kenney) \u2014 the Godot lane's FOURTH Godot 4 project and the THIRD Kenney starter kit, sibling of `starter-kit-3d-platformer` and `starter-kit-fps`: same upstream author, same starter-kit format, same engine line, a different GENRE. Where the first two Kenney kits both drive a CharacterBody3D (third-person jump/collect, first-person walk/aim/shoot), this one has no player body at all. Its loop is grid placement: a camera-orbit view raycasts the mouse onto a Plane, a GridMap holds cells, a MeshLibrary is built at runtime from an inventory of Structure resources, and the city serializes through ResourceSaver/ResourceLoader. That is the genre-distance this fixture exists to measure \u2014 tile placement, mouse picking, MeshLibrary construction, and save/load are the families a third platformer would never touch. It is an ANALYSIS FIXTURE, not a runnable ingest \u2014 nothing serves it, the import ladder measures it \u2014 which is why it lives here rather than in vendor/games/.\n\n WHY THIS PIN. `main` at 4535092b740b378b700efd9df9e27a631815b84a, MEASURED as the default branch's head at the retrieval date (`main`, 1,440 stars, not archived, last pushed 2026-03-12 \u2014 the pin IS that push, titled \"Upgrade to Godot 4.6\", exactly as both Kenney siblings' pins are those repositories' own \"Upgrade to Godot 4.6\"). The repository ships one project at its ROOT rather than one demo directory among many, so `upstream_path` is `.` and the fixture root IS the repository root. `project.godot` reads `config_version=5` and `config/features=PackedStringArray(\"4.6\", \"Forward Plus\")` \u2014 Godot 4.6, one minor behind the pinned `godot-4.7-extension_api.json` this lane adjudicates 4.x surface against, the same offset both siblings carry. HEAD was checked before pinning and needed no fallback: the commits immediately before it are the 4.5 upgrade sequence plus a community builder-script memory-leak fix (PR #20), none of them a restructure that would make an older commit the honest read.\n\n THE FIXTURE ID. `starter-kit-city-builder`, this project's own `config/name` (\"Starter Kit City Builder\") kebab-cased \u2014 the shelf's ordinary rule, applied with no exception, and the same rule that produced `starter-kit-3d-platformer` and `starter-kit-fps`. It collides with nothing on the shelf, so it needs no engine suffix, and adding one would name a variable this fixture does not hold.\n\n DOCUMENT FORMAT, measured file by file. One scene and sixteen text resources \u2014 `scenes/main.tscn` and 16 `.tres`, all `format=3`, no binary scene anywhere. Fifteen of the sixteen `.tres` are SCRIPTED RESOURCES \u2014 every file under `structures/` declares `type=\"Resource\" script_class=\"Structure\"`, backed by `scripts/structure.gd` \u2014 the same custom-`Resource`-class shape `starter-kit-fps` introduced with `Weapon`, now used as a tile catalog rather than a weapon catalog. TWO further custom Resource classes live only as scripts (`class_name DataMap`, `class_name DataStructure`) and are the save-game document: `builder.gd` constructs them at runtime and writes the result through `ResourceSaver.save`. ONE binary `.res` exists: `sample map/map.res` (14,103 bytes) is Godot's own `RSRC` container holding a serialized `DataMap` \u2014 the sample city the project's README instructs users to load with F3 \u2014 opened by this package's binary reader. FOUR `scenes/mai*.tmp` files (6,591 bytes together) are tracked upstream; they are incomplete `[gd_scene format=3]` drafts (two still reference a deleted `scripts/building.gd` and a never-shipped `library/mesh_library.tres`) and they are KEPT because they are upstream bytes, not a vendoring choice.\n\n LICENSE VERIFICATION, every file carrying terms read at the pinned commit. The repository root carries LICENSE.md, verbatim MIT (Copyright (c) 2025 Kenney), no additional terms \u2014 vendored, which is why `license_file` resolves, and confirmed independently by GitHub's own license detection for this repository (`mit`). README.md restates that MIT text (its copyright line reads 2026 where LICENSE.md reads 2025; the terms are identical) and then adds the one thing the license file does not say: \"Assets included in this package (2D sprites, 3D models and sound effects) are CC0 licensed\". That covers the 15 `.glb`, the 7 `.png`, the 11 `.ogg` and the `.fla`, all first-party Kenney work \u2014 the same asset grant, in the same place, as both siblings \u2014 and README.md is vendored because it is where that grant lives. ONE third-party file exists and carries its own terms beside it: `fonts/lilita_one_regular.ttf` is Lilita One (Copyright (c) 2011 Juan Montoreano), under the SIL Open Font License 1.1, whose full text is `fonts/license.txt` \u2014 vendored with it, since OFL-1.1 \u00a72 conditions redistribution on the copy carrying that notice. OFL-1.1 permits bundled redistribution and forbids only selling the font by itself, which this shelf does not do. That is the identical font and identical arrangement both siblings ship. No other file in the tree carries terms of its own.",
      "excluded_from_upstream": {
        "rule": "NOTHING is excluded. All 110 files upstream tracks at the pinned commit are vendored, byte-for-byte, at the fixture root.",
        "why": "MEASURED FIRST, as every lock on this shelf is. Upstream tracks 110 files totalling 2,069,806 bytes at the pinned commit and ALL 110 are vendored, byte-for-byte \u2014 verified by comparing each vendored file against `git cat-file blob` at that commit, 0 mismatches, 0 missing, 0 extra \u2014 so the vendored tree IS the upstream tree and the two counts below are the same number. This follows starter-kit-fps, starter-kit-3d-platformer and platformer-3d-godot4, which exclude nothing either; rota's extension whitelist exists because rota's upstream tree is 67.5 MB, and that reason does not arise at 2.07 MB.\n\n FOUR file classes were decided rather than defaulted, three of them the same classes this fixture's siblings had to decide.\n (1) `screenshots/` (screenshot.png, .gdignore \u2014 115 KB) is KEPT: it sits INSIDE the Godot project, which is why upstream put a .gdignore beside it, and it is what the project's own README.md renders.\n (2) The 6 `.uid` sidecars are KEPT: a Godot 4 addition with no Godot 3 counterpart, tracked upstream, and a fixture measuring what a Godot 4 project LOOKS like must not drop the files that only exist in Godot 4. Note the count is 6 against 6 `.gd` scripts \u2014 every script has one, and no scene or resource does, which is the Godot 4.6 shape both siblings carry.\n (3) `vector/sprites.fla` (74,795 bytes, an Adobe Animate source with a `.gdignore` beside it) is KEPT despite being ART-TOOL residue rather than project content. It is 3.6% of the tree, it is covered by the README's CC0 grant, and excluding it would buy nothing while making the \"the vendored tree IS the upstream tree\" claim above conditional \u2014 the same call both siblings make for their own `.fla`. `sounds/ambience.ogg` is 1,197,592 bytes \u2014 58% of the fixture \u2014 and is kept for the same reason: partial vendoring saves little and leaves the upper rungs without the assets they will render.\n (4) The four `scenes/mai*.tmp` files (6,591 bytes) and `sample map/map.res` (14,103 bytes) are KEPT. The `.tmp` files are editor-crash leftovers that look exactly like a vendoring mistake \u2014 they are incomplete scene drafts, two of them pointing at paths that do not exist in this tree \u2014 but they are TRACKED UPSTREAM, and dropping them would make the fixture disagree with upstream over bytes the reader may well have an opinion about. `sample map/map.res` is the opposite: it is load-bearing evidence (the binary `DataMap` F3 loads), and dropping it would delete the measurement. The directory name carries a space (`sample map/`); that is an upstream fact, not a rename.\n\n The repository ships NO chrome outside the Godot project \u2014 no `.github/`, no CONTRIBUTING.md, no build scripts \u2014 so as with both Kenney siblings there is no top-level layer to list here. The two files that are arguably git-only rather than Godot-only, `.gitignore` and `.gitattributes`, are vendored with the rest: the `.gitignore` names only build/import artefacts (`.godot/`, `.import/`, `export.cfg`, `export_presets.cfg`, `*.translation`, `.mono/`, `data_*/`, `mono_crash.*.json`, `build/`), none of which any of the 110 vendored paths matches, so it hides nothing from `verify-unaltered.mjs` or from git.",
