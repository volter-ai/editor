      "note": "Squash the Creeps (3D) — the finished game from Godot's own 'Your first 3D game' tutorial, and the Godot lane's FIRST 3D fixture: the 2D pilot (dodge-the-creeps) proved the pipe, this one exercises the 3D surface the lane's emission target actually differentiates on. Small enough to run the whole pipe on (4 scripts / 4 scenes) while exercising what the 2D pilot never touched — Spatial/KinematicBody/CollisionShape/MeshInstance/Camera/AnimationPlayer node trees, `Transform( basis…, origin… )` and `Vector3(...)` property values, .tres SpatialMaterial sub-resources, and .glb ext-resources. This is an ANALYSIS FIXTURE, not a runnable ingest — nothing serves it, the import ladder measures it — which is why it lives here rather than in vendor/games/.\n\nWHY THIS REPO AND NOT `godot-demo-projects@3.x`. The WO-G8 order named `3d/squash_the_creeps` in `godotengine/godot-demo-projects` at the same commit dodge-the-creeps is pinned to (fe1ccaea7725053f760d7a30b8a44619686224e8). MEASURED, not assumed: that path DOES NOT EXIST on the `3.x` branch. `git ls-tree fe1ccaea 3d/` lists global_illumination, ik, kinematic_character, material_testers, navmesh, physics_tests, platformer, rigidbody_character, truck_town, voxel, waypoints and README.md — no squash_the_creeps — and fe1ccaea IS the 3.x branch tip, so no other 3.x commit has it either; `3.5` and `4.0` do not have it either. `3d/squash_the_creeps` exists ONLY on `master`, where its `project.godot` reads `config_version=5` / `config/features=PackedStringArray(\"4.7\")` — a Godot 4 project, in a dialect this lane's pinned Godot 3.6 `api.json` and `config_version=4` readers cannot serve, and adopting it would have made the fixture a Godot-4 port order rather than a 3D order.\n\nThe SAME GAME in the Godot 3 dialect is `godotengine/godot-3d-dodge-the-creeps`, the official standalone repo the demo lived in before it was rewritten for Godot 4 (its README: 'This demo project was merged into the main godot-demo-projects repository'). It is archived, so its tip commit c4a5001 is a permanent pin. `dodge_the_creeps_3d/project.godot` reads `config_version=4` and `config/name=\"Squash the Creeps (3D)\"` — the identical dialect ROTA and the 2D pilot are read in, so the one pinned api.json serves all three. Every property the order actually wanted is preserved: same game, 3D, Godot 3, `godotengine` org, MIT, byte-identical vendoring. The fixture id stays `squash-the-creeps` (the project's own name) rather than the repo's directory name, because the directory name is the pre-rename artifact and would read as a second 2D fixture.\n\nLICENSE VERIFICATION, every file read at the pinned commit: the repository root carries LICENSE, verbatim MIT (Copyright (c) 2020 GDQuest), no additional terms — vendored to the fixture root, which is why `license_file` resolves. The repo-root README.md carries the third-party terms and is vendored beside it, which is what carries the attribution those terms require: art/'House In a Forest Loop.ogg' is CC-BY 3.0 (HorrorPen, opengameart.org) — byte-identical to the 2D pilot's copy, sha256 32680f2b…, the same asset in both demos — and fonts/Montserrat-Medium.ttf is SIL OFL 1.1 (The Montserrat Project Authors) with its own fonts/LICENSE.txt vendored beside it. The 3D art (art/mob.glb, art/player.glb, and the SpatialMaterial .tres files) is GDQuest's own, under the root MIT.",
      "excluded_from_upstream": {
        "rule": "The whole `dodge_the_creeps_3d/` project tree is vendored byte-for-byte at the fixture root — 26 of 26 files, the two sets identical rather than merely equal in size — plus the repository-root LICENSE and README.md, which the project tree does not carry and which the license verification above depends on. Excluded is exactly what lies OUTSIDE the Godot project and outside its licence story: the repository-root .gitignore, the two Blender sources under 3d_models/, and the README banner image.",
        "why": "MEASURED FIRST, as the 2D pilot's and rota's were. The whole repository is 3.79 MB, of which the vendored project tree is 1.90 MB; the 1.89 MB excluded is 1.84 MB of Blender sources (3d_models/mob.blend, 3d_models/player.blend) plus a 49 KB README banner and a 184-byte ignore file. The .blend files are the AUTHORING sources for art/mob.glb and art/player.glb: they live outside `res://`, no `res://` reference in any scene, script or .import sidecar names them, and Godot itself never opens them on this pin (the 3.x importer reads the .glb). Vendoring them would carry 1.84 MB the reader can never reach, to prove nothing. The banner is README chrome; the root .gitignore is the REPOSITORY's, not the project's. Two file classes were decided rather than defaulted. (1) Godot's `.import` sidecars are editor artifacts the S0 reader never opens — kept anyway, because they are part of what upstream tracks under the project directory and excluding them would make the vendored set a judgement call instead of a fact ('the whole project tree' needs no rule). (2) The project's OWN `.gitignore` (`.import`, `logs/`) is a nested ignore file that takes effect inside THIS repo — checked, and it matches no vendored path (the sidecars are named `<file>.glb.import`, not `.import`), so it is carried unaltered like everything else. Note that excluding the .blend files changes no diagnostic: `ext-resource-opaque` is a statement about the FORMAT this reader opens, reported identically whether or not the bytes are present, and nothing references the .blend files in the first place.",
